[Rule]
# --- 路由与防泄漏规则 ---
IP-CIDR6, ::/0, REJECT, no-resolve
DOMAIN-KEYWORD, stun, REJECT
DOMAIN-KEYWORD, turn, REJECT

# 常规分流规则 (修正：确保 RULE-SET 名称与 [Ruleset] 中定义完全一致)
RULE-SET, 广告拦截, 广告拦截
RULE-SET, 局域网, 🎯 全球直连
RULE-SET, 国内域名, 🎯 全球直连
RULE-SET, 微软, 🎯 全球直连
RULE-SET, Steam, 🎯 全球直连
RULE-SET, 游戏, 🎯 全球直连
RULE-SET, 苹果, 🎯 全球直连
RULE-SET, Telegram, 📲 电报消息, no-resolve
RULE-SET, Google, Google
RULE-SET, Github, 🚀 节点选择
RULE-SET, YouTube, 🚀 节点选择
RULE-SET, 代理域名, 🚀 节点选择
RULE-SET, Cloudflare, 🚀 节点选择, no-resolve
RULE-SET, Twitter, 🚀 节点选择, no-resolve
# OpenAI 规则 (配合 block-quic 实现 TCP 降级)
RULE-SET, OpenAI, 💬 Ai平台
DOMAIN-SUFFIX, modelscope.cn, 🎯 全球直连
FINAL, 🐟 漏网之鱼

