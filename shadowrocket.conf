
[General]
compatibility-mode = 0
# 旁路 iOS 必要系统流量，降低推送/系统服务被代理规则干扰的概率。
bypass-system = true

# 本机名称仍由系统/局域网处理；业务流量统一进入 TUN。
skip-proxy = 127.0.0.1,localhost,*.local,*.lan,*.home.arpa
tun-included-routes = 0.0.0.0/0,::/0
tun-excluded-routes = 127.0.0.0/8,169.254.0.0/16,224.0.0.0/4,255.255.255.255/32

# ---------- DNS ----------
# 代理/未知业务：Cloudflare + Google + Quad9 三家 DoH 并行，经当前代理发送。
dns-server = https://cloudflare-dns.com/dns-query#proxy,https://dns.google/dns-query#proxy,https://dns.quad9.net/dns-query#proxy

# 明确 DIRECT 业务：AliDNS + DNSPod 国内 DoH 并行，提升容错并取最快结果。
direct-dns-server = https://dns.alidns.com/dns-query#no-h3,https://doh.pub/dns-query#no-h3

# 节点域名必须在代理建立前完成解析，因此使用无需代理即可访问的加密 DNS。
proxy-dns-server = https://223.5.5.5/dns-query#no-h3,https://1.12.12.12/dns-query#no-h3

# 备用 DNS 使用 Cloudflare + Google + Quad9，经代理发送；不回退系统明文 DNS。
fallback-dns-server = https://cloudflare-dns.com/dns-query#proxy,https://dns.google/dns-query#proxy,https://dns.quad9.net/dns-query#proxy
dns-direct-system = false
dns-fallback-system = false
# DIRECT 的三个国内 DoH 全部失败时，允许经代理使用加密 fallback；
# 仍不回退系统明文 DNS，兼顾容错与防泄漏。
dns-direct-fallback-proxy = true

# 保留远端 DNS/Fake-IP 能力，不强制所有代理域名本地解析。
always-ip-address = false
always-real-ip = localhost,*.local,*.lan,*.home.arpa
private-ip-answer = true
# 显式固定 DNS 类型行为：A/AAAA 保持 Fake-IP 机制，其它常规类型允许查询；
# 禁止 HTTPS/SVCB 地址提示绕开 Fake-IP 地址返回路径。
allow-dns-all = true
allow-dns-svcb = false

# 接管应用硬编码的 53 端口 DNS。
hijack-dns = :53

# ---------- IP / UDP ----------
# 稳定优先：关闭业务 IPv6，避免机场 IPv6 支持不完整造成偶发直连/失败。
# 若确认节点和本地网络均完整支持 IPv6，可改为 true。
ipv6 = false
prefer-ipv6 = false

# VLESS 稳定优先：DIRECT 流量保留 QUIC/HTTP3；代理流量阻断 QUIC，
# 让 Safari/App 回落到 TCP/HTTP2，减少代理 UDP/443 抖动、MTU 与 NAT 问题。
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

# 代理链缺失时拒绝连接，避免绕过中转。
close-if-proxy-chain-missing = true

icmp-auto-reply = false
# 当前 URL Rewrite 仅使用 302，不需要让 REJECT 类重写跨模式强制生效。
always-reject-url-rewrite = false


[Proxy]
# 节点请通过 Shadowrocket 首页订阅添加。
# 不建议把订阅 URL、密码、证书或节点密钥写入可分享配置。


[Proxy Group]
# =========================
# 主控策略
# =========================
🚀 节点选择 = select,♻️ 自动选择,🚀 手动切换,🇭🇰 香港节点,🇯🇵 日本节点,🇸🇬 新加坡节点,🇺🇸 美国节点,🇹🇼 台湾节点,🇰🇷 韩国节点,🇬🇧 英国节点,🇩🇪 德国节点,🇨🇦 加拿大节点,🇦🇺 澳大利亚节点,PROXY,policy-select-name=♻️ 自动选择

# 排除机场公告/流量提示；主自动组只做一个简短排除，不为每个国家写巨型排除正则。
♻️ 自动选择 = url-test,policy-regex-filter=(?i)^(?!.*(?:剩余|到期|过期|重置|套餐|订阅|官网|客服|公告|流量用尽|有效期|remaining|expire|expiration|reset|subscription|traffic[ _：:\-]*(?:left|remaining|used|total)|https?://)).+$,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,timeout=5

🚀 手动切换 = select,policy-regex-filter=(?i)^(?!.*(?:剩余|到期|过期|重置|套餐|订阅|官网|客服|公告|流量用尽|有效期|remaining|expire|expiration|reset|subscription|traffic[ _：:\-]*(?:left|remaining|used|total)|https?://)).+$

# =========================
# 国家 / 地区自动组
# 只做正向匹配；国家代码使用字母边界防误匹配。国家组每 30 分钟测速一次，降低重复探测开销。
# =========================
🇭🇰 香港节点 = url-test,policy-regex-filter=(?i)(🇭🇰|香港|Hong[ _.-]*Kong|(?:^|[^A-Za-z])(?:HKG|HK)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇯🇵 日本节点 = url-test,policy-regex-filter=(?i)(🇯🇵|日本|東京|东京|大阪|Japan|Tokyo|Osaka|(?:^|[^A-Za-z])(?:JPN|JP)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇸🇬 新加坡节点 = url-test,policy-regex-filter=(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SGP|SG)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇺🇸 美国节点 = url-test,policy-regex-filter=(?i)(🇺🇸|🇺🇲|美国|美國|United[ _.-]*States|Los[ _.-]*Angeles|New[ _.-]*York|Seattle|San[ _.-]*Jose|(?:^|[^A-Za-z])(?:USA|US)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇹🇼 台湾节点 = url-test,policy-regex-filter=(?i)(🇹🇼|台湾|台灣|臺灣|台北|臺北|高雄|Taiwan|Taipei|Kaohsiung|(?:^|[^A-Za-z])(?:TWN|TW)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇰🇷 韩国节点 = url-test,policy-regex-filter=(?i)(🇰🇷|韩国|韓國|首尔|首爾|South[ _.-]*Korea|Korea|Seoul|(?:^|[^A-Za-z])(?:KOR|KR)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇬🇧 英国节点 = url-test,policy-regex-filter=(?i)(🇬🇧|英国|英國|伦敦|倫敦|United[ _.-]*Kingdom|Britain|England|London|(?:^|[^A-Za-z])(?:GBR|UK)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇩🇪 德国节点 = url-test,policy-regex-filter=(?i)(🇩🇪|德国|德國|法兰克福|法蘭克福|Germany|Deutschland|Frankfurt|(?:^|[^A-Za-z])(?:DEU|GER|DE)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇨🇦 加拿大节点 = url-test,policy-regex-filter=(?i)(🇨🇦|加拿大|Canada|Toronto|Vancouver|(?:^|[^A-Za-z])(?:CAN|CA)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5
🇦🇺 澳大利亚节点 = url-test,policy-regex-filter=(?i)(🇦🇺|澳大利亚|澳洲|Australia|Sydney|Melbourne|(?:^|[^A-Za-z])(?:AUS|AU)(?=$|[^A-Za-z])),url=https://www.gstatic.com/generate_204,interval=1800,tolerance=80,timeout=5

