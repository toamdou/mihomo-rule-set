
[General]
# 使用正常路由模式，避免继承 No Default Route / 兼容模式。
compatibility-mode = 0
# 只为本机和局域网名称选择 TUN 接管，不设置整站 Apple / Crashlytics 例外。
skip-proxy = 127.0.0.1,localhost,*.local
# 私网连接在规则中直连，避免把整个私网排除后，路由器 DNS 请求绕过控制。
# 不排除 198.18.0.0/15（Fake-IP）。本机环回和链路广播/组播保持系统兼容。
tun-included-routes = 0.0.0.0/0,::/0
tun-excluded-routes = 127.0.0.0/8,224.0.0.0/4,255.255.255.255/32

# 需要本地处理的非直连查询：经首页选定的默认代理发送到境外 DoH。
# #proxy 是 Shadowrocket 的 DNS-over-PROXY 参数，首页需保留可用节点。
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 明确命中 DIRECT 域名的查询：国内加密 DNS，有利于本地 CDN；并发取最快结果。
# 使用 IP 形式，避免解析 DoH 域名时再依赖系统明文 DNS。
direct-dns-server = https://223.5.5.5/dns-query#no-h3,https://1.12.12.12/dns-query#no-h3
# 节点自身域名的启动解析必须能在建立代理之前完成，只交给国内加密 DNS。
proxy-dns-server = https://223.5.5.5/dns-query#no-h3,https://1.12.12.12/dns-query#no-h3
# 备用仍是经代理的加密解析，不写 system，也不留空。
fallback-dns-server = https://8.8.8.8/dns-query#proxy,https://1.1.1.1/dns-query#proxy
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = true
# 不强制提前解析每一个代理业务域名，保留远端解析 / Fake-IP。
always-ip-address = false
always-real-ip = localhost,*.local,*.lan
private-ip-answer = true
hijack-dns = :53

# 关闭业务 IPv6 支持；规则区另拒绝原始 IPv6 目标。
ipv6 = false
prefer-ipv6 = false
# 禁止 HTTPS/SVCB 地址提示影响 Fake-IP；保留 TXT 等正常 DNS 类型。
allow-dns-all = true
allow-dns-svcb = false

# 只阻断代理业务 QUIC，国内直连 HTTP/3 保留。
# 不支持 UDP 的节点拒绝该 UDP 会话，不回退 DIRECT。
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
# STUN 返回替代地址，避免暴露真实候选公网地址。
# 这两项可能影响依赖 P2P 的通话/游戏；支持 TURN 的服务可继续尝试中继。
# 不能替代真机 WebRTC 测试，也不使用 stun/turn 域名关键词误杀。
stun-response-ip = 1.1.1.1
stun-response-ipv6 = ::1
icmp-auto-reply = false
always-reject-url-rewrite = true

[Proxy]
# 在 Shadowrocket 首页添加订阅。不要把订阅、密码或节点证书放在可分享配置中。

[Proxy Group]
# 策略名称与规则一致。自动/地区组测试 HTTPS 连通性，不以 ICMP 假回复选节点。
# 两位地区代码使用 ASCII 字母边界：匹配 JP01，不匹配 JPG；匹配 US，不匹配 Russia。
# 排除剩余流量/订阅到期等提示；匹配英文大小写、中文、繁体中文和旗帜。
# 名称同时标注多个地区的线路只留在全节点组，不猜测出口；按真实出口改备注即可归组。
# 空地区组不要选用；PROXY 是首页可用节点的手动兜底，不是 DIRECT。
