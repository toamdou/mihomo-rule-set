# 9. 最终兜底
# =========================================================
FINAL,🐟 漏网之鱼


[Host]
localhost = 127.0.0.1


[URL Rewrite]
# Safari / Google 中国入口强制转国际版，并保留路径与查询参数。
^https?://(www\.)?google\.cn(.*)$ https://www.google.com$2 302
^https?://(www\.)?g\.cn(.*)$ https://www.google.com$2 302


[MITM]
# MITM 仅用于 Google CN HTTPS 重写；完整 Advertising 不扩大 MITM，以减少兼容性和性能开销。
enable = true
h2 = true
hostname = google.cn,*.google.cn,g.cn,*.g.cn
