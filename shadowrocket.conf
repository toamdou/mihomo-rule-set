[Rule]
# 1. 防止未被 DNS 劫持接管的明文查询直接发出；不关闭正常的 mDNS/5353。
# Shadowrocket 自身的解析使用上面的 DoH/443。
DST-PORT,53,REJECT
# 应用自带 DoT/DoQ 走代理，避免被国内 DIRECT 规则直接放行。
DST-PORT,853,🚀 节点选择
IP-CIDR,::/0,REJECT,no-resolve

# 2. 已知应用 HTTPDNS：阻断后要求应用回到受控 DNS。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list,🛡 DNS防绕过,no-resolve
# 常见应用自带 DoH 端点走代理（不等同于已覆盖任意私有 DoH）。
DOMAIN,dns.google,🚀 节点选择
DOMAIN,cloudflare-dns.com,🚀 节点选择
DOMAIN,one.one.one.one,🚀 节点选择
DOMAIN,dns.quad9.net,🚀 节点选择
DOMAIN,dns.adguard-dns.com,🚀 节点选择
DOMAIN,dns.adguard.com,🚀 节点选择
DOMAIN-SUFFIX,dns.nextdns.io,🚀 节点选择
DOMAIN,doh.opendns.com,🚀 节点选择
DOMAIN,dns.alidns.com,🚀 节点选择
DOMAIN,doh.pub,🚀 节点选择
DOMAIN,dns.pub,🚀 节点选择

# 3. 只给必要功能设置优先例外，不整体放行广告/统计域名。
DOMAIN,captive.apple.com,DIRECT
DOMAIN,challenges.cloudflare.com,💬 AI平台
DOMAIN,api.statsig.com,💬 AI平台
DOMAIN-SUFFIX,featuregates.org,💬 AI平台
DOMAIN,events.statsigapi.net,💬 AI平台
# 补充 OpenAI 当前网络说明中的主站、登录、静态文件与少量兼容端点。
# 统计类只放行下列明确地址，不整体放行 sentry.io / datadoghq.com。
DOMAIN-SUFFIX,openai.com,💬 AI平台
DOMAIN-SUFFIX,chatgpt.com,💬 AI平台
DOMAIN-SUFFIX,oaistatic.com,💬 AI平台
DOMAIN-SUFFIX,oaiusercontent.com,💬 AI平台
DOMAIN-SUFFIX,oaistatsig.com,💬 AI平台
DOMAIN,cdn.openaimerge.com,💬 AI平台
DOMAIN,cdn.workos.com,💬 AI平台
DOMAIN,forwarder.workos.com,💬 AI平台
DOMAIN,setup.workos.com,💬 AI平台
DOMAIN,images.workoscdn.com,💬 AI平台
DOMAIN,workos.imgix.net,💬 AI平台
DOMAIN,humb.apple.com,💬 AI平台
DOMAIN,js.intercomcdn.com,💬 AI平台
DOMAIN,js.stripe.com,💬 AI平台
DOMAIN,o207216.ingest.sentry.io,💬 AI平台
DOMAIN,o33249.ingest.sentry.io,💬 AI平台
DOMAIN,rum.browser-intake-datadoghq.com,💬 AI平台
DOMAIN,ad.12306.cn,DIRECT

# 4. 完整广告、追踪与劫持库。Advertising 已包含 Privacy/Hijacking 等子库。
# DOMAIN-SET 与 RULE-SET 必须同时保留；URL-REGEX 的 HTTPS 部分需解密。
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising_Domain.list,🛑 广告拦截
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,🛑 广告拦截,no-resolve

# 5. 局域网。它的 DIRECT 规则不会替代前面的 DNS/53 保护规则。
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN,localhost,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# 6. AI 优先于 Google / Microsoft / Cloudflare / 国内合集。
DOMAIN-SUFFIX,grok.com,💬 AI平台
DOMAIN-SUFFIX,x.ai,💬 AI平台
DOMAIN,grok.x.com,💬 AI平台
DOMAIN-SUFFIX,perplexity.ai,💬 AI平台
DOMAIN-SUFFIX,pplx.ai,💬 AI平台
DOMAIN-SUFFIX,poe.com,💬 AI平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,💬 AI平台,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,💬 AI平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Gemini/Gemini.list,💬 AI平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Copilot/Copilot.list,💬 AI平台,no-resolve

# 7. 专用代理服务优先于通用代理集合；YouTube 必须先于 Google。
